name: Mise à jour revue de presse

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install feedparser requests

      - name: Récupérer et filtrer les articles
        run: python scripts/fetch_news.py

      - name: Publier les changements
        run: |
          git config user.name "revue-de-presse-bot"
          git config user.email "actions@github.com"
          git add docs/articles.json
          git diff --quiet --cached || git commit -m "Mise à jour automatique de la revue de presse"
          git push
